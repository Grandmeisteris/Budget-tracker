<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Budget Tracker</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #f0f0f0;
    --muted: #888;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --yellow: #eab308;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px 12px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .app-title { font-size: 17px; font-weight: 600; color: var(--text); }
  .month-nav { display: flex; align-items: center; gap: 12px; }
  .month-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .month-name { font-size: 16px; font-weight: 600; min-width: 90px; text-align: center; }

  /* SUMMARY CARDS */
  .summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 16px 16px 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 10px; min-width: 0; }
  .card-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-value { font-size: clamp(14px, 4.4vw, 18px); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; }
  .card-value.green { color: var(--green); }
  .card-value.red { color: var(--red); }
  .card-value.blue { color: var(--blue); }
  .card-wide { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin: 8px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .progress-wrap { flex: 1; margin: 0 12px; }
  .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

  /* TABS */
  .tabs { display: flex; gap: 0; padding: 16px 16px 0; }
  .tab-btn { flex: 1; padding: 10px 4px; font-size: 13px; font-weight: 500; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: var(--font); transition: all 0.15s; }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  /* ADD FORM */
  .add-form { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin: 12px 16px; padding: 14px; }
  .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-row:last-child { margin-bottom: 0; }
  select, input[type="number"], input[type="text"], input[type="date"] {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font); font-size: 14px; padding: 10px 12px;
    appearance: none; -webkit-appearance: none; outline: none; width: 100%;
  }
  select:focus, input:focus { border-color: var(--blue); }
  .btn-add { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: var(--font); }
  .btn-add:active { opacity: 0.8; }

  /* TRANSACTION LIST */
  .list-section { padding: 0 16px; }
  .list-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 8px; }
  .list-header-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .tx-list { display: flex; flex-direction: column; gap: 4px; }
  .tx-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .tx-item.tappable { cursor: pointer; transition: background 0.12s, border-color 0.12s; }
  .tx-item.tappable:active { background: var(--surface2); border-color: var(--blue); }
  .tx-chevron { color: var(--border); font-size: 16px; flex-shrink: 0; line-height: 1; }
  .tx-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-cat { font-size: 14px; font-weight: 500; color: var(--text); }
  .tx-date { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .tx-amount { font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .tx-del { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 0 4px; line-height: 1; }
  .tx-del:active { color: var(--red); }
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

  /* BUDGET TAB */
  .budget-list { display: flex; flex-direction: column; gap: 6px; padding: 0 16px; }
  .budget-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .budget-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .budget-cat { font-size: 14px; font-weight: 500; }
  .budget-nums { font-size: 13px; color: var(--muted); }
  .budget-nums span { font-weight: 600; }
  .budget-nums .ok { color: var(--green); }
  .budget-nums .over { color: var(--red); }

  /* REPORT TAB */
  .report-section { padding: 12px 16px 0; }
  .report-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .report-title { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .report-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .report-row:last-child { border-bottom: none; }
  .report-row .label { color: var(--muted); }
  .export-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 14px; font-weight: 500; padding: 12px; width: 100%; cursor: pointer; margin-top: 4px; }
  .export-btn:active { opacity: 0.7; }
  .insight-row { font-size: 14px; line-height: 1.5; padding: 9px 0 9px 26px; border-bottom: 1px solid var(--border); position: relative; }
  .insight-row:last-child { border-bottom: none; }
  .insight-row .ico { position: absolute; left: 0; top: 9px; font-size: 14px; line-height: 1.5; }
  .insight-group { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin: 14px 0 2px; }
  .insight-group:first-child { margin-top: 0; }

  /* SCORE CARD */
  .score-top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .score-ring { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .score-ring svg { transform: rotate(-90deg); display: block; }
  .score-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-num b { font-size: 22px; font-weight: 700; line-height: 1; }
  .score-num span { font-size: 9px; color: var(--muted); margin-top: 2px; }
  .score-verdict { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .score-desc { font-size: 13px; color: var(--muted); line-height: 1.45; }
  .score-bars { display: flex; flex-direction: column; gap: 9px; }
  .score-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .score-bar-label .n { color: var(--muted); }
  .tip-row { font-size: 14px; line-height: 1.5; padding: 10px 12px; background: var(--surface2); border-radius: 8px; border-left: 3px solid var(--yellow); margin-bottom: 8px; }
  .tip-row:last-child { margin-bottom: 0; }
  .tip-row b { color: var(--text); font-weight: 700; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: rgba(26,26,26,0.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; align-items: stretch;
    padding: 6px 2px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .nav-item {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; padding: 7px 1px; border: none; background: none;
    color: var(--muted); font-family: var(--font);
    border-radius: 10px; transition: color 0.15s, background 0.15s;
  }
  .nav-item.active { color: var(--blue); background: rgba(59,130,246,0.10); }
  .nav-item:active { background: rgba(255,255,255,0.05); }
  .nav-icon { font-size: 18px; line-height: 1.1; }
  .nav-label {
    font-size: 9.5px; font-weight: 600; letter-spacing: -0.2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 100%; line-height: 1.2;
  }
  @media (max-width: 360px) {
    .nav-label { font-size: 8.5px; letter-spacing: -0.3px; }
    .nav-icon { font-size: 17px; }
  }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 20px env(safe-area-inset-bottom, 20px); width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; }
  .modal-row { margin-bottom: 12px; }
  .modal-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn-cancel { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 15px; font-weight: 500; padding: 12px; cursor: pointer; }
  .btn-save { flex: 2; background: var(--blue); border: none; border-radius: 8px; color: #fff; font-family: var(--font); font-size: 15px; font-weight: 600; padding: 12px; cursor: pointer; }

  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; margin-left: 6px; }
  .tag.green { background: rgba(34,197,94,0.15); color: var(--green); }
  .tag.red { background: rgba(239,68,68,0.15); color: var(--red); }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">💰 Budget Tracker</div>
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-name" id="monthLabel"></div>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
</div>

<div id="summaryArea"></div>

<div id="mainContent"></div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchPage('expenses')" id="nav-expenses">
    <span class="nav-icon">💸</span>
    <span class="nav-label">Išlaidos</span>
  </button>
  <button class="nav-item" onclick="switchPage('income')" id="nav-income">
    <span class="nav-icon">💵</span>
    <span class="nav-label">Pajamos</span>
  </button>
  <button class="nav-item" onclick="switchPage('fixed')" id="nav-fixed">
    <span class="nav-icon">🔁</span>
    <span class="nav-label">Fiksuotos</span>
  </button>
  <button class="nav-item" onclick="switchPage('budget')" id="nav-budget">
    <span class="nav-icon">🎯</span>
    <span class="nav-label">Biudžetas</span>
  </button>
  <button class="nav-item" onclick="switchPage('report')" id="nav-report">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Ataskaita</span>
  </button>
</nav>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Pridėti išlaidą</div>
    <div class="modal-row">
      <div class="modal-label">Kategorija</div>
      <select id="mCat"></select>
    </div>
    <div class="modal-row">
      <div class="modal-label">Suma (€)</div>
      <input type="number" id="mAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
    </div>
    <div class="modal-row">
      <div class="modal-label">Aprašymas (nebūtina)</div>
      <input type="text" id="mDesc" placeholder="pvz. Lidl, Bolt...">
    </div>
    <div class="modal-row">
      <div class="modal-label">Data</div>
      <input type="date" id="mDate">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Atšaukti</button>
      <button class="btn-save" onclick="saveEntry()">Išsaugoti</button>
    </div>
    <button id="mDelete" onclick="deleteFromModal()" style="display:none;width:100%;margin-top:10px;background:none;border:none;color:var(--red);font-family:var(--font);font-size:14px;font-weight:600;padding:10px;cursor:pointer;">Ištrinti įrašą</button>
  </div>
</div>

<!-- FIXED EXPENSE MODAL -->
<div class="modal-overlay" id="fixedModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="fixedModalTitle">Nauja fiksuota išlaida</div>
    <div class="modal-row">
      <div class="modal-label">Kategorija</div>
      <select id="fCat"></select>
    </div>
    <div class="modal-row">
      <div class="modal-label">Suma per mėnesį (€)</div>
      <input type="number" id="fAmount" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
    </div>
    <div class="modal-row">
      <div class="modal-label">Aprašymas (nebūtina)</div>
      <input type="text" id="fDesc" placeholder="pvz. Nuoma, Spotify...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeFixedModal()">Atšaukti</button>
      <button class="btn-save" onclick="saveFixedEntry()">Išsaugoti</button>
    </div>
    <button id="fDelete" onclick="deleteFixedFromModal()" style="display:none;width:100%;margin-top:10px;background:none;border:none;color:var(--red);font-family:var(--font);font-size:14px;font-weight:600;padding:10px;cursor:pointer;">Ištrinti fiksuotą išlaidą</button>
  </div>
</div>

<!-- BUDGET EDIT MODAL -->
<div class="modal-overlay" id="budgetModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Keisti planą — <span id="bmCatName"></span></div>
    <div class="modal-row">
      <div class="modal-label">Planuojama suma per mėnesį (€)</div>
      <input type="number" id="bmAmount" placeholder="0" step="1" min="0" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBudgetModal()">Atšaukti</button>
      <button class="btn-save" onclick="saveBudgetEdit()">Išsaugoti</button>
    </div>
  </div>
</div>

<!-- ADD CATEGORY MODAL -->
<div class="modal-overlay" id="categoryModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Nauja kategorija</div>
    <div class="modal-row">
      <div class="modal-label">Pavadinimas</div>
      <input type="text" id="ncName" placeholder="pvz. Dovanos">
    </div>
    <div class="modal-row">
      <div class="modal-label">Planuojamas biudžetas (€, nebūtina)</div>
      <input type="number" id="ncBudget" placeholder="0" step="1" min="0" inputmode="decimal">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeCategoryModal()">Atšaukti</button>
      <button class="btn-save" onclick="saveNewCategory()">Pridėti</button>
    </div>
  </div>
</div>

<script>
const EXP_CATS = ['Maistas','Išeiti','Transportas','Sveikata','Sportas','Būstas','Prenumeratos','Kirpykla','Drabužiai','Kita'];
const INC_CATS = ['Agentūra','Freelance','Verslas','Investicijos','Kita'];

const BUDGET_PLAN = {
  'Maistas': 350, 'Išeiti': 100, 'Transportas': 30, 'Sveikata': 27,
  'Sportas': 19, 'Būstas': 220, 'Prenumeratos': 25, 'Kirpykla': 15,
  'Drabužiai': 0, 'Kita': 0
};
const INCOME_PLAN = { 'Agentūra': 1200, 'Freelance': 480, 'Verslas': 0, 'Investicijos': 0, 'Kita': 0 };

const MONTHS_LT = ['Sausis','Vasaris','Kovas','Balandis','Gegužė','Birželis','Liepa','Rugpjūtis','Rugsėjis','Spalis','Lapkritis','Gruodis'];
const MONTHS_SHORT = ['Sau','Vas','Kov','Bal','Geg','Bir','Lie','Rugp','Rgs','Spa','Lap','Gruo'];

let currentDate = new Date();
let currentPage = 'expenses';
let modalType = 'expense';

function storageKey(d) {
  return `bt_${d.getFullYear()}_${d.getMonth()}`;
}

function getData() {
  const raw = localStorage.getItem(storageKey(currentDate));
  if (!raw) return { expenses: [], income: [] };
  return JSON.parse(raw);
}

function saveData(d) {
  localStorage.setItem(storageKey(currentDate), JSON.stringify(d));
}

function getCategories() {
  const raw = localStorage.getItem('bt_categories');
  return raw ? JSON.parse(raw) : [...EXP_CATS];
}

function saveCategories(cats) {
  localStorage.setItem('bt_categories', JSON.stringify(cats));
}

function getBudgetPlan() {
  const raw = localStorage.getItem('bt_budget_plan');
  return raw ? JSON.parse(raw) : { ...BUDGET_PLAN };
}

function saveBudgetPlan(plan) {
  localStorage.setItem('bt_budget_plan', JSON.stringify(plan));
}

function escQ(s) {
  return String(s).replace(/'/g, "\\'");
}

function getFixedExpenses() {
  const raw = localStorage.getItem('bt_fixed_expenses');
  return raw ? JSON.parse(raw) : [];
}

function saveFixedExpenses(list) {
  localStorage.setItem('bt_fixed_expenses', JSON.stringify(list));
}

function fixedAsExpensesFor(d) {
  const firstOfMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
  return getFixedExpenses().map(f => ({ ...f, date: firstOfMonth, fixed: true }));
}

function getEffectiveData() {
  const data = getData();
  return { expenses: [...fixedAsExpensesFor(currentDate), ...data.expenses], income: data.income };
}

function getEffectiveMonthData(d) {
  const raw = getMonthData(d);
  return { expenses: [...fixedAsExpensesFor(d), ...raw.expenses], income: raw.income };
}

function fmtAmount(n) {
  return '€' + parseFloat(n).toFixed(2).replace('.', ',');
}

function fmtDate(str) {
  if (!str) return '';
  const [y,m,d] = str.split('-');
  return `${d}.${m}.${y}`;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function changeMonth(dir) {
  currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + dir, 1);
  render();
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + page).classList.add('active');
  render();
}

let editingEntryId = null;

function openModal(type, id) {
  modalType = type;
  editingEntryId = id || null;
  const cats = type === 'expense' ? getCategories() : INC_CATS;
  const sel = document.getElementById('mCat');
  sel.innerHTML = cats.map(c => `<option>${c}</option>`).join('');

  if (editingEntryId) {
    const list = type === 'expense' ? getData().expenses : getData().income;
    const entry = list.find(e => e.id === editingEntryId);
    if (!entry) { editingEntryId = null; return; }
    document.getElementById('modalTitle').textContent = type === 'expense' ? 'Redaguoti išlaidą' : 'Redaguoti pajamas';
    if (!cats.includes(entry.cat)) sel.innerHTML += `<option>${entry.cat}</option>`;
    sel.value = entry.cat;
    document.getElementById('mAmount').value = entry.amount;
    document.getElementById('mDesc').value = entry.desc || '';
    document.getElementById('mDate').value = entry.date;
    document.getElementById('mDelete').style.display = 'block';
  } else {
    document.getElementById('modalTitle').textContent = type === 'expense' ? 'Pridėti išlaidą' : 'Pridėti pajamas';
    document.getElementById('mAmount').value = '';
    document.getElementById('mDesc').value = '';
    document.getElementById('mDate').value = todayStr();
    document.getElementById('mDelete').style.display = 'none';
  }

  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('mAmount').focus(), 100);
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
  editingEntryId = null;
}

function saveEntry() {
  const amt = parseFloat(document.getElementById('mAmount').value);
  if (!amt || amt <= 0) { alert('Įvesk sumą'); return; }
  const data = getData();
  const listKey = modalType === 'expense' ? 'expenses' : 'income';

  if (editingEntryId) {
    const entry = data[listKey].find(e => e.id === editingEntryId);
    if (entry) {
      entry.cat = document.getElementById('mCat').value;
      entry.amount = amt;
      entry.desc = document.getElementById('mDesc').value.trim();
      entry.date = document.getElementById('mDate').value;
    }
  } else {
    data[listKey].push({
      id: Date.now(),
      cat: document.getElementById('mCat').value,
      amount: amt,
      desc: document.getElementById('mDesc').value.trim(),
      date: document.getElementById('mDate').value
    });
  }
  saveData(data);
  closeModal();
  render();

function getMonthData(d) {
  const raw = localStorage.getItem(storageKey(d));
  return raw ? JSON.parse(raw) : { expenses: [], income: [] };
}

/* ---------- analysis helpers ---------- */

function sumOf(list) { return list.reduce((s,e) => s + e.amount, 0); }

function groupByCat(list) {
  const o = {};
  list.forEach(e => { o[e.cat] = (o[e.cat] || 0) + e.amount; });
  return o;
}

function hasRealActivity(d) {
  const raw = getMonthData(d);
  return raw.expenses.length > 0 || raw.income.length > 0;
}

// Previous months (relative to currentDate) that actually have entries, newest first.
function historyMonths(n) {
  const out = [];
  for (let i = 1; i <= n; i++) {
    const d = new Date(currentDate.getFullYear(), currentDate.getMonth() - i, 1);
    if (hasRealActivity(d)) out.push({ date: d, data: getEffectiveMonthData(d) });
  }
  return out;
}

function isCurrentRealMonth() {
  const now = new Date();
  return now.getFullYear() === currentDate.getFullYear() && now.getMonth() === currentDate.getMonth();
}

// How many days of the viewed month have elapsed (full month if it's in the past).
function elapsedDaysInMonth() {
  const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
  if (isCurrentRealMonth()) return Math.min(new Date().getDate(), daysInMonth);
  return daysInMonth;
}

function annual(n) { return fmtAmount(n * 12); }

/* ---------- financial health score ---------- */

function computeScore(data) {
  // Without real entries for this month the metrics are vacuously perfect
  // (spending nothing "meets" every budget), so there is no score to show.
  if (!hasRealActivity(currentDate)) {
    return { pct: null, parts: [], verdict: null, desc: '', color: '' };
  }

  const totalExp = sumOf(data.expenses);
  const totalInc = sumOf(data.income);
  const parts = [];
  let score = 0, max = 0;

  // Savings rate — the single biggest driver of long-term outcomes.
  if (totalInc > 0) {
    const sr = ((totalInc - totalExp) / totalInc) * 100;
    let p;
    if (sr >= 30) p = 40;
    else if (sr <= 0) p = 0;
    else p = Math.round((sr / 30) * 40);
    score += p; max += 40;
    parts.push({ label: 'Santaupų norma', got: p, of: 40, note: `${sr.toFixed(0)}%` });
  }

  // Budget adherence.
  const plan = getBudgetPlan();
  const planned = Object.entries(plan).filter(([, v]) => v > 0);
  if (planned.length > 0) {
    const ec = groupByCat(data.expenses);
    const within = planned.filter(([c, v]) => (ec[c] || 0) <= v).length;
    const p = Math.round((within / planned.length) * 25);
    score += p; max += 25;
    parts.push({ label: 'Biudžeto laikymasis', got: p, of: 25, note: `${within}/${planned.length} kat.` });
  }

  // Fixed-cost burden — high fixed costs reduce flexibility.
  const fixedSum = sumOf(data.expenses.filter(e => e.fixed));
  if (totalInc > 0 && fixedSum > 0) {
    const ratio = (fixedSum / totalInc) * 100;
    let p;
    if (ratio <= 35) p = 20;
    else if (ratio >= 70) p = 0;
    else p = Math.round((1 - (ratio - 35) / 35) * 20);
    score += p; max += 20;
    parts.push({ label: 'Fiksuotų išlaidų našta', got: p, of: 20, note: `${ratio.toFixed(0)}% pajamų` });
  }

  // Stability vs recent history — predictable spending is easier to plan around.
  const hist = historyMonths(3);
  if (hist.length > 0) {
    const avg = hist.reduce((s,h) => s + sumOf(h.data.expenses), 0) / hist.length;
    if (avg > 0) {
      const devPct = Math.abs(totalExp - avg) / avg * 100;
      let p;
      if (devPct <= 10) p = 15;
      else if (devPct >= 50) p = 0;
      else p = Math.round((1 - (devPct - 10) / 40) * 15);
      score += p; max += 15;
      const sign = totalExp >= avg ? '+' : '';
      parts.push({ label: 'Išlaidų stabilumas', got: p, of: 15, note: `${sign}${((totalExp - avg) / avg * 100).toFixed(0)}% nuo vidurkio` });
    }
  }

  const pct = max > 0 ? Math.round((score / max) * 100) : null;
  let verdict = null, desc = '', color = 'var(--muted)';
  if (pct !== null) {
    if (pct >= 80) { verdict = 'Puikiai valdai pinigus'; desc = 'Taupai reikšmingą dalį pajamų ir laikaisi plano. Toliau tuo pačiu keliu — apsvarstyk investavimą.'; color = 'var(--green)'; }
    else if (pct >= 65) { verdict = 'Gerai'; desc = 'Finansai kontroliuojami, bet yra ką patobulinti — žiūrėk patarimus žemiau.'; color = 'var(--green)'; }
    else if (pct >= 45) { verdict = 'Vidutiniškai'; desc = 'Pagrindai yra, tačiau taupymas ar biudžeto laikymasis šlubuoja. Pradėk nuo vienos kategorijos.'; color = 'var(--yellow)'; }
    else { verdict = 'Reikia dėmesio'; desc = 'Išlaidos suvalgo per didelę pajamų dalį. Susifokusuok į didžiausią kategoriją ir fiksuotas išlaidas.'; color = 'var(--red)'; }
  }
  return { pct, parts, verdict, desc, color };
}

/* ---------- insights ---------- */

function generateInsights(data) {
  const empty = { comparison: [], patterns: [], tips: [] };
  if (data.expenses.length === 0 && data.income.length === 0) {
    empty.comparison.push({ ico: 'ℹ️', text: 'Šį mėnesį dar nėra jokių įrašų — pridėk išlaidų ar pajamų, kad matytum analizę ir pastebėjimus.' });
    return empty;
  }

  const comparison = [], patterns = [], tips = [];
  const totalExp = sumOf(data.expenses);
  const totalInc = sumOf(data.income);
  const savRate = totalInc > 0 ? ((totalInc - totalExp) / totalInc) * 100 : null;
  const expByCat = groupByCat(data.expenses);
  const variable = data.expenses.filter(e => !e.fixed);
  const fixedSum = sumOf(data.expenses.filter(e => e.fixed));

  const prevDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
  const prevHas = hasRealActivity(prevDate);
  const prevData = getEffectiveMonthData(prevDate);
  const prevExp = sumOf(prevData.expenses);
  const prevExpByCat = groupByCat(prevData.expenses);
  const hist = historyMonths(3);

  /* --- A. Comparison vs history --- */

  if (prevHas && prevExp > 0) {
    const diff = totalExp - prevExp;
    const pct = (diff / prevExp) * 100;
    if (Math.abs(pct) >= 5) {
      comparison.push({
        ico: diff > 0 ? '📈' : '📉',
        text: diff > 0
          ? `Išlaidos išaugo <b>${pct.toFixed(0)}%</b> (+${fmtAmount(diff)}) lyginant su ${MONTHS_LT[prevDate.getMonth()].toLowerCase()} mėn.`
          : `Išlaidos sumažėjo <b>${Math.abs(pct).toFixed(0)}%</b> (${fmtAmount(Math.abs(diff))}) lyginant su ${MONTHS_LT[prevDate.getMonth()].toLowerCase()} mėn. Puiku!`
      });
    } else {
      comparison.push({ ico: '➡️', text: 'Išlaidos beveik nepakito nuo praėjusio mėnesio — laikaisi stabilaus lygio.' });
    }
  }

  // Against a multi-month average, which is more reliable than a single month.
  if (hist.length >= 2) {
    const avg = hist.reduce((s,h) => s + sumOf(h.data.expenses), 0) / hist.length;
    if (avg > 0) {
      const d = totalExp - avg;
      const p = (d / avg) * 100;
      comparison.push({
        ico: '📊',
        text: `Palyginti su paskutinių ${hist.length} mėn. vidurkiu (${fmtAmount(avg)}) šį mėnesį išleidai <b>${p >= 0 ? '+' : ''}${p.toFixed(0)}%</b> (${d >= 0 ? '+' : ''}${fmtAmount(d)}).`
      });
    }
  }

  // Biggest mover, up or down.
  const allCats = new Set([...Object.keys(expByCat), ...Object.keys(prevExpByCat)]);
  let up = null, down = null;
  if (prevHas) {
    allCats.forEach(cat => {
      const d = (expByCat[cat] || 0) - (prevExpByCat[cat] || 0);
      if (d >= 10 && (!up || d > up.d)) up = { cat, d };
      if (d <= -10 && (!down || d < down.d)) down = { cat, d };
    });
    if (up) {
      const base = prevExpByCat[up.cat] || 0;
      const pctTxt = base > 0 ? ` (+${((up.d / base) * 100).toFixed(0)}%)` : '';
      comparison.push({ ico: '🔺', text: `Labiausiai augo „<b>${up.cat}</b>“ — +${fmtAmount(up.d)}${pctTxt} nuo praėjusio mėnesio.` });
    }
    if (down) {
      comparison.push({ ico: '🔻', text: `Labiausiai sumažėjo „<b>${down.cat}</b>“ — ${fmtAmount(Math.abs(down.d))} mažiau nei praėjusį mėnesį.` });
    }
  }

  // A category rising three months straight is a habit forming, not noise.
  if (hist.length >= 2) {
    Object.keys(expByCat).forEach(cat => {
      const series = [expByCat[cat] || 0, ...hist.map(h => groupByCat(h.data.expenses)[cat] || 0)];
      if (series.length >= 3 && series[0] > series[1] && series[1] > series[2] && series[0] - series[2] >= 15) {
        patterns.push({ ico: '⚠️', text: `„<b>${cat}</b>“ auga jau trečią mėnesį iš eilės (${fmtAmount(series[2])} → ${fmtAmount(series[1])} → ${fmtAmount(series[0])}) — panašu į besiformuojantį įprotį.` });
      }
    });
  }

  // Income direction matters as much as spending.
  if (prevHas) {
    const prevInc = sumOf(prevData.income);
    if (prevInc > 0 && totalInc > 0) {
      const p = ((totalInc - prevInc) / prevInc) * 100;
      if (Math.abs(p) >= 10) {
        comparison.push({
          ico: p > 0 ? '💰' : '💸',
          text: `Pajamos ${p > 0 ? 'išaugo' : 'sumažėjo'} <b>${Math.abs(p).toFixed(0)}%</b> (${p > 0 ? '+' : ''}${fmtAmount(totalInc - prevInc)}) nuo praėjusio mėnesio.`
        });
      }
    }
  }

  /* --- B. Behaviour patterns (variable spending only) --- */

  const elapsed = elapsedDaysInMonth();

  // Pace projection — only meaningful while the month is still running, and only
  // once enough days have passed that a single big purchase doesn't skew it wildly.
  if (isCurrentRealMonth() && elapsed >= 8 && totalExp > 0) {
    const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
    const daysLeft = daysInMonth - elapsed;
    const variableSoFar = sumOf(variable);
    const perDay = variableSoFar / elapsed;
    const projected = fixedSum + perDay * daysInMonth;
    patterns.push({
      ico: '⏳',
      text: `Praėjo ${elapsed} iš ${daysInMonth} d. Kintamos išlaidos — ${fmtAmount(perDay)}/dieną. Jei tempas nesikeis, mėnuo baigsis ties <b>${fmtAmount(projected)}</b>.`
    });
    // Turn the comparison into an actionable daily allowance rather than a scary total.
    if (prevHas && prevExp > 0 && projected > prevExp * 1.1) {
      if (totalExp < prevExp && daysLeft > 0) {
        const perDayLeft = (prevExp - totalExp) / daysLeft;
        patterns.push({ ico: '🚨', text: `Tokiu tempu viršysi praėjusį mėnesį (${fmtAmount(prevExp)}). Kad neviršytum, likusioms ${daysLeft} d. gali leisti apie <b>${fmtAmount(perDayLeft)}/dieną</b>.` });
      } else if (totalExp >= prevExp) {
        patterns.push({ ico: '🚨', text: `Jau viršijai praėjusio mėnesio išlaidas (${fmtAmount(prevExp)}) — o mėnuo dar nesibaigė. Likusias ${daysLeft} d. verta stabdyti kintamas išlaidas.` });
      }
    }
  }

  if (variable.length >= 4) {
    // Weekend vs weekday intensity, normalised per calendar day.
    let wkSum = 0, wdSum = 0;
    variable.forEach(e => {
      const day = new Date(e.date + 'T00:00:00').getDay();
      if (day === 0 || day === 6) wkSum += e.amount; else wdSum += e.amount;
    });
    let wkDays = 0, wdDays = 0;
    for (let i = 1; i <= elapsed; i++) {
      const day = new Date(currentDate.getFullYear(), currentDate.getMonth(), i).getDay();
      if (day === 0 || day === 6) wkDays++; else wdDays++;
    }
    if (wkDays > 0 && wdDays > 0 && (wkSum > 0 || wdSum > 0)) {
      const aWk = wkSum / wkDays, aWd = wdSum / wdDays;
      if (aWk > aWd * 1.3) {
        patterns.push({ ico: '🎉', text: `Savaitgaliais išleidi vidutiniškai <b>${fmtAmount(aWk)}</b>/d., darbo dienomis — ${fmtAmount(aWd)}/d. (${((aWk/aWd - 1) * 100).toFixed(0)}% daugiau).` });
      } else if (aWd > aWk * 1.3) {
        patterns.push({ ico: '🗓️', text: `Daugiausia išleidi darbo dienomis (${fmtAmount(aWd)}/d. vs ${fmtAmount(aWk)}/d. savaitgaliais) — dažnai tai kasdienis maistas ar transportas.` });
      }
    }

    // The "small purchases" effect — individually trivial, collectively not.
    const catTx = {};
    variable.forEach(e => {
      if (!catTx[e.cat]) catTx[e.cat] = [];
      catTx[e.cat].push(e.amount);
    });
    let smallest = null;
    Object.entries(catTx).forEach(([cat, arr]) => {
      const sum = arr.reduce((s,v) => s + v, 0);
      const avg = sum / arr.length;
      if (arr.length >= 5 && avg <= 15 && (!smallest || sum > smallest.sum)) smallest = { cat, n: arr.length, avg, sum };
    });
    if (smallest) {
      patterns.push({
        ico: '☕',
        text: `Smulkių pirkimų efektas: „<b>${smallest.cat}</b>“ — ${smallest.n} kartai po ~${fmtAmount(smallest.avg)}, iš viso ${fmtAmount(smallest.sum)}. Per metus tokiu tempu ≈ <b>${annual(smallest.sum)}</b>.`
      });
    }

    // No-spend days signal deliberate control.
    const spendDays = new Set(variable.map(e => e.date));
    const noSpend = elapsed - spendDays.size;
    if (noSpend > 0) {
      patterns.push({ ico: '🟢', text: `Dienų be jokių kintamų išlaidų: <b>${noSpend}</b> iš ${elapsed}. Kuo jų daugiau, tuo lengviau valdyti biudžetą.` });
    }

    // Front-loading vs back-loading within the month.
    const firstHalf = sumOf(variable.filter(e => parseInt(e.date.split('-')[2], 10) <= 15));
    const secondHalf = sumOf(variable) - firstHalf;
    if (elapsed > 20 && firstHalf > 0 && secondHalf > 0) {
      if (firstHalf > secondHalf * 1.5) {
        patterns.push({ ico: '📆', text: `Didžioji dalis išlaidų (${fmtAmount(firstHalf)}) tenka mėnesio pradžiai — po atlyginimo išleidžiama greitai. Pabandyk iškart atidėti taupymo dalį.` });
      } else if (secondHalf > firstHalf * 1.5) {
        patterns.push({ ico: '📆', text: `Išlaidos koncentruojasi mėnesio antroje pusėje (${fmtAmount(secondHalf)}) — verta stebėti, kad pabaigoje netrūktų lėšų.` });
      }
    }
  }

  // Concentration of spend in one category.
  const topCat = Object.entries(expByCat).sort((a,b) => b[1]-a[1])[0];
  if (topCat && totalExp > 0) {
    const share = (topCat[1] / totalExp) * 100;
    if (share >= 35) {
      patterns.push({ ico: '🥇', text: `„<b>${topCat[0]}</b>“ sudaro ${share.toFixed(0)}% visų išlaidų (${fmtAmount(topCat[1])}) — didžiausia koncentracija šį mėnesį.` });
    }
  }

  if (fixedSum > 0 && totalExp > 0) {
    const fShare = (fixedSum / totalExp) * 100;
    patterns.push({ ico: '🔁', text: `Fiksuotos išlaidos — ${fmtAmount(fixedSum)} (${fShare.toFixed(0)}% išlaidų), kintamos — ${fmtAmount(totalExp - fixedSum)}. Kintamas dalis yra ta, kurią realiai gali valdyti kasdien.` });
  }

  if (variable.length > 0) {
    const biggest = [...variable].sort((a,b) => b.amount - a.amount)[0];
    patterns.push({ ico: '🔍', text: `Didžiausia pavienė išlaida: ${biggest.cat}${biggest.desc ? ' („' + biggest.desc + '“)' : ''} — <b>${fmtAmount(biggest.amount)}</b> (${fmtDate(biggest.date)}).` });
  }

  /* --- C. Actionable tips --- */

  const plan = getBudgetPlan();
  const overBudget = Object.entries(plan)
    .filter(([cat, p]) => p > 0 && (expByCat[cat] || 0) > p)
    .map(([cat, p]) => ({ cat, over: (expByCat[cat] || 0) - p, planned: p }))
    .sort((a,b) => b.over - a.over);

  if (overBudget.length > 0) {
    const o = overBudget[0];
    const n = overBudget.length;
    const catWord = n === 1 ? 'kategorijoje' : (n % 10 === 0 || (n % 100 >= 11 && n % 100 <= 19) ? 'kategorijų' : 'kategorijose');
    tips.push(`Biudžetas viršytas <b>${n}</b> ${catWord}. Didžiausias viršijimas — „<b>${o.cat}</b>“: ${fmtAmount(expByCat[o.cat])} vietoj ${fmtAmount(o.planned)}. Grįžus prie plano sutaupytum <b>${annual(o.over)}</b> per metus.`);
  } else if (Object.values(plan).some(v => v > 0)) {
    tips.push('Visos kategorijos telpa į suplanuotą biudžetą 👍 Jei taip laikosi kelis mėnesius — apsvarstyk planų sumažinimą ir skirtumo taupymą.');
  }

  // Concrete, quantified cut on the biggest controllable category.
  const topVariable = Object.entries(groupByCat(variable)).sort((a,b) => b[1]-a[1])[0];
  if (topVariable && topVariable[1] >= 30) {
    const cut = topVariable[1] * 0.15;
    tips.push(`Didžiausia valdoma kategorija — „<b>${topVariable[0]}</b>“ (${fmtAmount(topVariable[1])}). Sumažinus ją tik <b>15%</b>, sutaupytum ${fmtAmount(cut)}/mėn. arba <b>${annual(cut)}</b> per metus.`);
  }

  if (totalInc > 0 && fixedSum > 0) {
    const fRatio = (fixedSum / totalInc) * 100;
    if (fRatio > 50) {
      tips.push(`Fiksuotos išlaidos suryja <b>${fRatio.toFixed(0)}%</b> pajamų — tai mažina lankstumą. Peržiūrėk prenumeratas ir sutartis: net ${fmtAmount(20)}/mėn. sumažinimas duoda ${annual(20)} per metus.`);
    } else if (fRatio <= 35) {
      tips.push(`Fiksuotos išlaidos sudaro tik ${fRatio.toFixed(0)}% pajamų — sveika proporcija, palieka erdvės taupymui ir netikėtoms išlaidoms.`);
    }
  }

  if (savRate !== null) {
    if (savRate < 0) {
      tips.push(`Šį mėnesį išleista daugiau nei uždirbta (${fmtAmount(Math.abs(totalInc - totalExp))} minuso). Pirmas žingsnis — padengti skirtumą iš atsargų ir sumažinti didžiausią kintamą kategoriją.`);
    } else if (savRate < 10) {
      const target = totalInc * 0.2 - (totalInc - totalExp);
      tips.push(`Santaupų norma ${savRate.toFixed(0)}% — žemiau rekomenduojamų 20%. Kad pasiektum 20%, reikėtų sutaupyti dar <b>${fmtAmount(target)}</b> per mėnesį.`);
    } else if (savRate < 20) {
      const target = totalInc * 0.2 - (totalInc - totalExp);
      tips.push(`Santaupų norma ${savRate.toFixed(0)}% — jau neblogai. Iki „auksinės“ 20% ribos trūksta ${fmtAmount(target)} per mėnesį.`);
    } else {
      tips.push(`Santaupų norma <b>${savRate.toFixed(0)}%</b> — virš rekomenduojamų 20%. Jei taip laikosi nuolat, kitas žingsnis: atsargų fondas 3–6 mėn. išlaidoms (${fmtAmount(totalExp * 3)}–${fmtAmount(totalExp * 6)}), o po to investavimas.`);
    }
  }

  if (totalExp > 0 && fixedSum > 0) {
    tips.push(`Orientyras: atsargų fondas 3 mėn. tavo išlaidų ≈ <b>${fmtAmount(totalExp * 3)}</b>. Būtent tiek padeda išgyventi pajamų netekimą nesiskolinant.`);
  }

  if (!prevHas && hist.length === 0) {
    comparison.push({ ico: 'ℹ️', text: 'Praėjusio mėnesio duomenų nėra, todėl palyginimų kol kas nedaug — kitą mėnesį analizė bus išsamesnė.' });
  }

  return { comparison, patterns, tips };
}

function renderReport() {
  const data = getEffectiveData();
  const totalExp = data.expenses.reduce((s,e) => s + e.amount, 0);
  const totalInc = data.income.reduce((s,e) => s + e.amount, 0);
  const savings = totalInc - totalExp;
  const savRate = totalInc > 0 ? ((savings/totalInc)*100).toFixed(0) : '0';

  const expByCat = {};
  data.expenses.forEach(e => { expByCat[e.cat] = (expByCat[e.cat] || 0) + e.amount; });
  const incByCat = {};
  data.income.forEach(e => { incByCat[e.cat] = (incByCat[e.cat] || 0) + e.amount; });

  const topCats = Object.entries(expByCat).sort((a,b) => b[1]-a[1]).slice(0, 5);
  const insights = generateInsights(data);
  const score = computeScore(data);

  const monthName = MONTHS_LT[currentDate.getMonth()] + ' ' + currentDate.getFullYear();

  const renderRows = arr => arr.map(i => `<div class="insight-row"><span class="ico">${i.ico}</span>${i.text}</div>`).join('');

  const CIRC = 226.19; // 2πr for r=36
  const scoreCard = score.pct === null ? '' : `
      <div class="report-card">
        <div class="report-title">🧭 Finansinės sveikatos indeksas</div>
        <div class="score-top">
          <div class="score-ring">
            <svg width="84" height="84" viewBox="0 0 84 84">
              <circle cx="42" cy="42" r="36" fill="none" stroke="var(--border)" stroke-width="8"></circle>
              <circle cx="42" cy="42" r="36" fill="none" stroke="${score.color}" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="${CIRC}" stroke-dashoffset="${(CIRC * (1 - score.pct / 100)).toFixed(1)}"></circle>
            </svg>
            <div class="score-num"><b style="color:${score.color};">${score.pct}</b><span>iš 100</span></div>
          </div>
          <div style="flex:1;min-width:0;">
            <div class="score-verdict" style="color:${score.color};">${score.verdict}</div>
            <div class="score-desc">${score.desc}</div>
          </div>
        </div>
        <div class="score-bars">
          ${score.parts.map(p => `
            <div>
              <div class="score-bar-label"><span>${p.label}</span><span class="n">${p.note} · ${p.got}/${p.of}</span></div>
              <div class="progress-track">
                <div class="progress-fill" style="width:${((p.got / p.of) * 100).toFixed(0)}%;background:${p.got / p.of >= 0.7 ? 'var(--green)' : p.got / p.of >= 0.4 ? 'var(--yellow)' : 'var(--red)'}"></div>
              </div>
            </div>
          `).join('')}
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:12px;line-height:1.45;">${isCurrentRealMonth() ? '<b style="color:var(--yellow);">Mėnuo dar nesibaigė</b> — rodiklis preliminarus ir keisis. ' : ''}Tai orientacinis šios programėlės rodiklis, skaičiuojamas iš santaupų normos, biudžeto laikymosi, fiksuotų išlaidų dalies ir išlaidų stabilumo. Ne oficialus finansinio raštingumo testas.</div>
      </div>`;

  document.getElementById('mainContent').innerHTML = `
    <div class="report-section">
      <div class="report-card">
        <div class="report-title">📋 ${monthName} — suvestinė</div>
        <div class="report-row"><span class="label">Visos pajamos</span><span style="color:var(--green);font-weight:600;">${fmtAmount(totalInc)}</span></div>
        <div class="report-row"><span class="label">Visos išlaidos</span><span style="color:var(--red);font-weight:600;">${fmtAmount(totalExp)}</span></div>
        <div class="report-row"><span class="label">Santaupos</span><span style="color:${savings >= 0 ? 'var(--green)' : 'var(--red)'};font-weight:700;">${savings >= 0 ? '+' : ''}${fmtAmount(savings)}</span></div>
        <div class="report-row"><span class="label">Santaupų rodiklis</span><span style="font-weight:600;">${savRate}%</span></div>
        <div class="report-row"><span class="label">Įrašų skaičius</span><span>${data.expenses.length + data.income.length}</span></div>
      </div>

      ${scoreCard}

      <div class="report-card">
        <div class="report-title">🔍 Mėnesio analizė ir pastebėjimai</div>
        ${insights.comparison.length ? `<div class="insight-group">Palyginimas su ankstesniais mėnesiais</div>${renderRows(insights.comparison)}` : ''}
        ${insights.patterns.length ? `<div class="insight-group">Išlaidų įpročiai ir elgsena</div>${renderRows(insights.patterns)}` : ''}
      </div>

      ${insights.tips.length ? `
      <div class="report-card">
        <div class="report-title">💡 Ką galima pagerinti</div>
        ${insights.tips.map(t => `<div class="tip-row">${t}</div>`).join('')}
      </div>` : ''}

      <div class="report-card">
        <div class="report-title">💸 Pajamų šaltiniai</div>
        ${Object.entries(incByCat).length === 0 ? '<div style="color:var(--muted);font-size:14px;">Nėra duomenų</div>' :
          Object.entries(incByCat).sort((a,b)=>b[1]-a[1]).map(([cat, amt]) => `
            <div class="report-row">
              <span class="label">${cat}</span>
              <span style="font-weight:600;">${fmtAmount(amt)}</span>
            </div>
          `).join('')}
      </div>

      <div class="report-card">
        <div class="report-title">📉 Top išlaidų kategorijos</div>
        ${topCats.length === 0 ? '<div style="color:var(--muted);font-size:14px;">Nėra duomenų</div>' :
          topCats.map(([cat, amt]) => {
            const pct = totalExp > 0 ? ((amt/totalExp)*100).toFixed(0) : 0;
            return `
              <div class="report-row">
                <span class="label">${cat}</span>
                <span><span style="color:var(--muted);font-size:12px;margin-right:8px;">${pct}%</span><span style="font-weight:600;color:var(--red);">-${fmtAmount(amt)}</span></span>
              </div>
            `;
          }).join('')}
      </div>

      <button class="export-btn" onclick="exportCSV()">📥 Eksportuoti kaip CSV</button>
      <div style="height:8px;"></div>
    </div>
  `;
}

function exportCSV() {
  const data = getEffectiveData();
  const month = MONTHS_LT[currentDate.getMonth()] + '_' + currentDate.getFullYear();
  let csv = 'Tipas,Data,Kategorija,Aprašymas,Suma\n';
  data.income.forEach(e => {
    csv += `Pajamos,${fmtDate(e.date)},${e.cat},"${e.desc || ''}",${e.amount.toFixed(2)}\n`;
  });
  data.expenses.forEach(e => {
    csv += `${e.fixed ? 'Išlaidos (fiksuota)' : 'Išlaidos'},${e.fixed ? 'Kas mėnesį' : fmtDate(e.date)},${e.cat},"${e.desc || ''}",-${e.amount.toFixed(2)}\n`;
  });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `budget_${month}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function render() {
  document.getElementById('monthLabel').textContent = MONTHS_SHORT[currentDate.getMonth()] + ' ' + currentDate.getFullYear();
  renderSummary();
  if (currentPage === 'expenses') renderExpenses();
  else if (currentPage === 'income') renderIncome();
  else if (currentPage === 'fixed') renderFixed();
  else if (currentPage === 'budget') renderBudget();
  else if (currentPage === 'report') renderReport();
}

document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
document.getElementById('fixedModal').addEventListener('click', function(e) {
  if (e.target === this) closeFixedModal();
});
document.getElementById('budgetModal').addEventListener('click', function(e) {
  if (e.target === this) closeBudgetModal();
});
document.getElementById('categoryModal').addEventListener('click', function(e) {
  if (e.target === this) closeCategoryModal();
});

render();
</script>
